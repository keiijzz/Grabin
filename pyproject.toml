[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grabin"
version = "0.1.0"
description = "Universal social media downloader (FB/TikTok/IG/YT/...) berbasis yt-dlp"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Enggar Irawan", email = "keiijzz@users.noreply.github.com" }]
dependencies = ["yt-dlp>=2024.8.6", "pyyaml>=6.0", "rich>=13.0"]

[project.scripts]
grabin = "grabin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
